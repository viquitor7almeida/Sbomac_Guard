name: Attestation gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e empacotamento (fat jar + SBOM resolvido)
        run: mvn -B -ntp verify

      - name: Chaves Ed25519 efêmeras de CI
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar keygen --out-dir /tmp/keys

      - name: Attest do próprio SBOMGuard (dogfooding)
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar attest . --output-dir dist

      - name: Assina o manifesto de integridade
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar sign dist/sbomguard.manifest.json --key /tmp/keys/sbomguard-signing.pem

      - name: GATE - verify (exit != 0 quebra o pipeline)
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar verify dist/sbomguard.manifest.json --key /tmp/keys/sbomguard-signing.pub --project .

      - name: GATE - ledger íntegro
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar ledger dist --verify

      - name: Âncora do ledger (checkpoint assinado para publicação externa)
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar anchor dist --key /tmp/keys/sbomguard-signing.pem

      - name: GATE - ledger conforme a âncora
        run: java -jar target/sbomguard-0.1.0-SNAPSHOT.jar ledger dist --verify --anchor dist/sbomguard.anchor.json --key /tmp/keys/sbomguard-signing.pub

      - name: Artefatos de proveniência
        uses: actions/upload-artifact@v7
        with:
          name: provenance
          path: |
            dist/sbomguard.sbom.json
            dist/sbomguard.manifest.json
            dist/sbomguard.manifest.json.sig
            dist/sbomguard.ledger.jsonl
            dist/sbomguard.anchor.json
            target/bom.json
          if-no-files-found: error
